name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          python -m py_compile backend/app/main.py
          find . -name "*.py" -exec python -m py_compile {} \;
          ! grep -r "api.comexstat.mdic.gov.br" . --include="*.py" || (echo "Real API found!" && exit 1)
          ! grep -r "api.bcb.gov.br" . --include="*.py" || (echo "Real API found!" && exit 1)
          echo "No real APIs"
      - name: Check images
        run: ls -lh docs/images/
